name: Visual regression tests
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Generate Ubuntu Chromium screenshot baselines for review and commit
        required: true
        default: false
        type: boolean
env:
  LANG: "en_GB.UTF-8"
  LANGUAGE: "en_GB:en"
  LC_ALL: "en_GB.UTF-8"
jobs:
  visual-regression:
    name: Visual regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: |
          if [[ "${{ inputs.update-snapshots }}" == "true" ]]; then
            npm run test:visual:update
          else
            npm run test:visual
          fi

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright failure results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload updated Linux baselines
        if: ${{ inputs.update-snapshots == true }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-linux-snapshots
          path: tests/visual/storybook.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7